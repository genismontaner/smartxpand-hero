<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Codificació de caràcters: perquè es vegin bé accents i "ñ" -->
  <meta charset="UTF-8">
  <!-- Fa que la pàgina s'adapti a l'amplada del mòbil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartXpand · Mapa de oportunidad</title>
  <meta name="description" content="Cribado de zonas para abrir un gimnasio low cost en Barcelona: puntuación sobre 100 por hexágono, con criterios, pesos y fuentes visibles. Caso ilustrativo con datos públicos.">

  <!-- Targeta en compartir l'enllaç (LinkedIn, WhatsApp, correu...): Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://genismontaner.github.io/smartxpand-hero/">
  <meta property="og:title" content="SmartXpand · Mapa de oportunidad para gimnasios low cost">
  <meta property="og:description" content="Qué zonas de Barcelona son prioritarias para abrir un gimnasio, y por qué. Caso ilustrativo elaborado con datos públicos.">
  <meta property="og:image" content="https://genismontaner.github.io/smartxpand-hero/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Mapa de Barcelona con hexágonos clasificados en prioritarias, cerca del umbral y no prioritarias, y panel de decisión de una zona.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Icona de la pestanya -->
  <link rel="icon" href="assets/icona.svg?v=19n" type="image/svg+xml">

  <!-- Estils de Leaflet (llibreria de mapes), des d'un CDN públic -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <!-- Els nostres estils. "?v=..." és la versió: canviar-la en cada publicació
       obliga el navegador a descarregar els fitxers nous (en lloc de la còpia guardada) -->
  <link rel="stylesheet" href="css/estils.css?v=19n">
</head>
<body>
  <!-- Capçalera -->
  <header class="capcalera">
    <div class="marca">SmartXpand</div>
    <div class="titol">
      <!-- El nom de la vista canvia amb la porta d'entrada (js/app.js, canviaMode) -->
      <span class="nom-vista">Mapa de oportunidad</span> <span>· Gimnasio low cost · Barcelona</span>
    </div>
    <button class="boto-captura boto-enllac" title="Copia un enlace que abre esta vista con los mismos parámetros">Copiar enlace</button>
    <button class="boto-captura" title="Oculta los controles para hacer una captura de pantalla">Modo captura</button>
    <div class="etiqueta-cas">Caso ilustrativo</div>
  </header>

  <!-- Missatge breu en entrar al mode captura (desapareix sol) -->
  <div class="avis-toast" role="status">Modo captura · pulsa Esc (o toca la cabecera) para salir</div>

  <main class="app">
    <!-- Contenidor on Leaflet dibuixarà el mapa -->
    <div id="mapa"></div>
    <!-- Avís mentre es carreguen les dades (js/app.js el treu en acabar) -->
    <div class="avis-carrega" role="status">Cargando datos de población…</div>

    <aside class="lateral">
      <!-- Nansa per plegar/desplegar la fitxa (només es veu al mòbil) -->
      <button class="nansa" aria-label="Ver más detalle"></button>

      <!-- Les dues portes d'entrada: descobrir zones o avaluar un local concret -->
      <nav class="selector-mode">
        <button class="mode activa" data-mode="descobrir">Descubrir zonas</button>
        <button class="mode" data-mode="avaluar">Evaluar un local</button>
      </nav>

      <!-- Pestanyes del mode descobrir: la zona seleccionada i els controls -->
      <nav class="pestanyes">
        <button class="pestanya activa" data-vista="panell">Zona</button>
        <button class="pestanya" data-vista="ajustes">Parámetros</button>
      </nav>

      <!-- Panell de decisió: el contingut l'omple js/panell.js -->
      <div id="panell" class="vista"></div>

      <!-- Paràmetres comuns (els dibuixa js/app.js; els controls es mouen entre vistes) -->
      <div id="ajustes" class="vista" hidden></div>

      <!-- Mode avaluar: controls i resultats (els omple js/avaluacio.js) -->
      <div id="avaluacio" class="vista" hidden></div>

      <!-- Avís fix (principis d'honestedat): sempre visible -->
      <footer class="avis-cas">
        Caso ilustrativo elaborado con datos públicos. VivaGym no es cliente de
        SmartXpand ni ha participado en este análisis.
        <!-- Fonts resumides: només es veuen en mode captura (les omple app.js) -->
        <div class="fonts-captura"></div>
        <div class="parametres-captura fonts-captura"></div>
      </footer>
    </aside>
  </main>

  <!-- Primer Leaflet, després el nostre codi (que el fa servir) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/panell.js?v=19n"></script>
  <script src="js/avaluacio.js?v=19n"></script>
  <script src="js/isocrones.js?v=19n"></script>
  <script src="js/mirroring.js?v=19n"></script>
  <script src="js/comparador.js?v=19n"></script>
  <script src="js/calibratge.js?v=19n"></script>
  <script src="js/descobriment.js?v=19n"></script>
  <script src="js/enllac.js?v=19n"></script>
  <script src="js/app.js?v=19n"></script>
</body>
</html>
